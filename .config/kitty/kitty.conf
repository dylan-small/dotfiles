# Kitty Configuration

# Font
font_family      JetBrains Mono
font_size        11.0

# Nerd Font symbols
symbol_map U+E0A0-U+E0A3,U+E0C0-U+E0C7 Symbols Nerd Font Mono
symbol_map U+E200-U+E2A9 Symbols Nerd Font Mono
symbol_map U+E5FA-U+E6B5 Symbols Nerd Font Mono
symbol_map U+E700-U+E7C5 Symbols Nerd Font Mono
symbol_map U+EA60-U+EC1E Symbols Nerd Font Mono
symbol_map U+ED00-U+EFCE Symbols Nerd Font Mono
symbol_map U+F000-U+F2FF Symbols Nerd Font Mono
symbol_map U+F300-U+F372 Symbols Nerd Font Mono
symbol_map U+F400-U+F533 Symbols Nerd Font Mono
symbol_map U+F0001-U+F1AF0 Symbols Nerd Font Mono

# Cursor
cursor_blink_interval 0
cursor_trail 1

# Mouse
mouse_hide_wait 3.0
url_style curly

# Scrollback
scrollback_lines 200000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# Performance
repaint_delay 10
input_delay 3

# Window layout
window_padding_width 4

# Tab bar
tab_bar_style powerline
tab_powerline_style slanted

# Color scheme - loaded from theme
include theme.conf
background_opacity 0.95

# Advanced
shell_integration no-cursor
