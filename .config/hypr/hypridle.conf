general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 3 min — cmatrix screensaver
listener {
    timeout = 6000
    on-timeout = $HOME/.config/hypr/scripts/screensaver.sh start
    on-resume = $HOME/.config/hypr/scripts/screensaver.sh stop
}

# 5 min — lock screen
listener {
    timeout = 300000
    on-timeout = loginctl lock-session
}

# 5.5 min — screens off
listener {
    timeout = 33000000
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 30 min — suspend
listener {
    timeout = 1099000000
    on-timeout = systemctl suspend
}
